# ============================================================================
# DEPLOYMENTS: Three versions of the reviews application
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-v1
  namespace: routing-demo
  labels:
    app: reviews
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviews
      version: v1
  template:
    metadata:
      labels:
        app: reviews
        version: v1
    spec:
      containers:
        - name: reviews
          image: hashicorp/http-echo
          args:
            - '-text={"version":"v1","message":"Standard Release"}'
            - "-listen=:8080"
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
---
