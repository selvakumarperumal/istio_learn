# ============================================================================
# DESTINATION RULE: Define subsets for each version
# ============================================================================
# Subsets map version labels to named groups that VirtualService can target.
# Without subsets, VirtualService cannot route to specific versions.
#
# HOW SUBSETS WORK:
#   1. Service (reviews-svc) selects ALL pods with app=reviews
#   2. DestinationRule adds ADDITIONAL filters using version labels
#   3. VirtualService routes to "subset: v1" → pods with version=v1
#
# RELATED FILES:
#   - virtual-service.yaml: Uses these subsets in routing rules
#   - deployment.yaml: Pods with version labels v1, v2, v3
# ============================================================================
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: reviews-destination
  namespace: routing-demo
spec:
  host: reviews-svc # Matches the Service name (not the app label!)
  subsets:
    # Subset v1 - matches pods with version=v1 label
    - name: v1
      labels:
        version: v1
    # Subset v2 - matches pods with version=v2 label
    - name: v2
      labels:
        version: v2
    # Subset v3 - matches pods with version=v3 label
    - name: v3
      labels:
        version: v3
