# ============================================================================
# HTTP ROUTE: Header-Based Request Routing (Gateway API)
# ============================================================================
# PURPOSE:
#   Define HTTP routing rules to direct traffic to different service versions
#   based on request headers. This enables A/B testing, canary deployments,
#   and user-segmentation without code changes.
#
#   This replaces the Istio VirtualService with the standard Kubernetes
#   Gateway API HTTPRoute resource.
#
# 🔄 TRAFFIC FLOW:
#   ┌─────────────────────────────────────────────────────────────────────────┐
#   │                                                                         │
#   │   Incoming Request                                                      │
#   │        │                                                                │
#   │        ▼                                                                │
#   │   ┌─────────────────────────────────────────────────────────────────┐   │
#   │   │               HTTPRoute: reviews-routing                        │   │
#   │   │                                                                 │   │
#   │   │   Check headers:                                                │   │
#   │   │   ┌────────────────────────────────────────────────────────┐    │   │
#   │   │   │ x-user-type: beta?     ──yes──► reviews-v2-svc (Beta) │    │   │
#   │   │   └────────────────────────────────────────────────────────┘    │   │
#   │   │                 │no                                             │   │
#   │   │                 ▼                                               │   │
#   │   │   ┌────────────────────────────────────────────────────────┐    │   │
#   │   │   │ x-user-type: internal? ──yes──► reviews-v3-svc (Int.) │    │   │
#   │   │   └────────────────────────────────────────────────────────┘    │   │
#   │   │                 │no                                             │   │
#   │   │                 ▼                                               │   │
#   │   │   ┌────────────────────────────────────────────────────────┐    │   │
#   │   │   │ Default (no match)     ──────► reviews-v1-svc (Stable)│    │   │
#   │   │   └────────────────────────────────────────────────────────┘    │   │
#   │   │                                                                 │   │
#   │   └─────────────────────────────────────────────────────────────────┘   │
#   │                                                                         │
#   └─────────────────────────────────────────────────────────────────────────┘
#
# 📌 RULE EVALUATION ORDER:
#   Rules are evaluated TOP TO BOTTOM. First match wins!
#   The DEFAULT route (no match conditions) should always be LAST.
#
# ⚠️  KEY DIFFERENCE FROM VIRTUALSERVICE:
#   Gateway API HTTPRoute does NOT support DestinationRule subsets.
#   Instead, we create separate Kubernetes Services per version:
#     - reviews-v1-svc → selects pods with app=reviews, version=v1
#     - reviews-v2-svc → selects pods with app=reviews, version=v2
#     - reviews-v3-svc → selects pods with app=reviews, version=v3
#
# 🧪 HOW TO TEST:
#   # Test v2 (beta users):
#   curl -H "x-user-type: beta" http://<GATEWAY_IP>/
#
#   # Test v3 (internal team):
#   curl -H "x-user-type: internal" http://<GATEWAY_IP>/
#
#   # Test v1 (default - no header):
#   curl http://<GATEWAY_IP>/
#
# 📝 HEADER MATCHING OPTIONS (Gateway API):
#   Exact:              type: Exact, value: "beta"
#   RegularExpression:  type: RegularExpression, value: "^(beta|test)$"
#
# 🔗 RELATED FILES:
#   - service.yaml      : Per-version Services for routing
#   - deployment.yaml   : Creates pods for each version
#   - gateway.yaml      : Gateway API entry point for external traffic
# ============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: reviews-routing
  namespace: routing-demo

spec:
  # ═══════════════════════════════════════════════════════════════════════════
  # PARENT REFS: Which Gateway does this route attach to?
  # ═══════════════════════════════════════════════════════════════════════════
  # In Gateway API, HTTPRoute attaches to a Gateway via parentRefs.
  # This replaces the VirtualService "gateways" field.
  #
  parentRefs:
    - name: reviews-gateway # Reference to the Gateway resource
      sectionName: http # Matches the listener name in Gateway

  # ═══════════════════════════════════════════════════════════════════════════
  # HOSTNAMES: Which hostnames does this route match?
  # ═══════════════════════════════════════════════════════════════════════════
  # Replaces VirtualService "hosts" field.
  # Must be a subset of the Gateway listener's hostname.
  hostnames:
    - reviews.example.com

  # ═══════════════════════════════════════════════════════════════════════════
  # RULES: HTTP routing rules with header-based matching
  # ═══════════════════════════════════════════════════════════════════════════
  # Rules are evaluated in ORDER. First matching rule is applied.
  # Always put more specific rules FIRST, default/catch-all rules LAST.
  #
  rules:
    # ─────────────────────────────────────────────────────────────────────────
    # RULE 1: Route beta testers to v2
    # ─────────────────────────────────────────────────────────────────────────
    # Use case: Let beta testers preview new features before public release.
    #
    - matches:
        - headers:
            - name: x-user-type
              type: Exact
              value: beta
      backendRefs:
        - name: reviews-v2-svc # Per-version Service (replaces subset)
          port: 80

    # ─────────────────────────────────────────────────────────────────────────
    # RULE 2: Route internal team to v3
    # ─────────────────────────────────────────────────────────────────────────
    # Use case: Internal testing of cutting-edge features.
    #
    - matches:
        - headers:
            - name: x-user-type
              type: Exact
              value: internal
      backendRefs:
        - name: reviews-v3-svc # Per-version Service (replaces subset)
          port: 80

    # ─────────────────────────────────────────────────────────────────────────
    # DEFAULT RULE: All other traffic goes to v1 (stable)
    # ─────────────────────────────────────────────────────────────────────────
    # IMPORTANT: This rule has NO match conditions, so it catches everything
    # that didn't match above. This MUST be the last rule!
    #
    - backendRefs:
        - name: reviews-v1-svc # Stable production version
          port: 80

# ═══════════════════════════════════════════════════════════════════════════════
# 📚 ADDITIONAL ROUTING EXAMPLES (Gateway API)
# ═══════════════════════════════════════════════════════════════════════════════
#
# ROUTE BY URI PATH:
#   rules:
#     - matches:
#         - path:
#             type: PathPrefix
#             value: /api/v2
#       backendRefs:
#         - name: reviews-v2-svc
#           port: 80
#
# ROUTE BY QUERY PARAMETER:
#   rules:
#     - matches:
#         - queryParams:
#             - name: version
#               type: Exact
#               value: v2
#       backendRefs:
#         - name: reviews-v2-svc
#           port: 80
#
# COMBINE MULTIPLE CONDITIONS (AND logic):
#   rules:
#     - matches:
#         - headers:
#             - name: x-user-type
#               type: Exact
#               value: beta
#           path:
#             type: PathPrefix
#             value: /api
#       backendRefs:
#         - name: reviews-v2-svc
#           port: 80
#
# ═══════════════════════════════════════════════════════════════════════════════
