# ============================================================================
# FAULT INJECTION: Delay - Add latency to test timeout handling
# ============================================================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: httpbin-delay
  namespace: fault-demo
spec:
  hosts:
    - httpbin
    - httpbin.example.com
  gateways:
    - httpbin-gateway
    - mesh
  http:
    - fault:
        delay:
          # ═══════════════════════════════════════════════════════════════
          # Inject 5 second delay on 50% of requests
          # ═══════════════════════════════════════════════════════════════
          percentage:
            value: 50 # Apply to 50% of requests
          fixedDelay: 5s # 5 second delay
      route:
        - destination:
            host: httpbin
            port:
              number: 80
