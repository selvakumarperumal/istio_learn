# Fortio load testing client
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  namespace: circuit-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      containers:
        - name: fortio
          image: fortio/fortio
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: fortio
  namespace: circuit-demo
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: fortio
