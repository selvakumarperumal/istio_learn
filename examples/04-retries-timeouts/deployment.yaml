# httpbin for testing retries
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: retry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      containers:
        - name: httpbin
          image: kennethreitz/httpbin
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: retry-demo
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: httpbin
