# ============================================================================
# GATEWAY: External Traffic Entry Point for Retries/Timeouts Demo
# ============================================================================
# PURPOSE:
#   Configures a Kubernetes Gateway API resource to accept external HTTP
#   traffic for testing retry and timeout behaviors.
#
# NOTE: Retry and timeout policies are configured in the HTTPRoute resource.
#   Gateway API supports timeouts natively. For advanced retry policies,
#   Istio extends the Gateway API with annotations or BackendPolicy.
#
# RELATED FILES:
#   - httproute.yaml : Defines routing with retry/timeout policies
#   - deployment.yaml : The httpbin target service
# ============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: httpbin-gateway # Referenced by HTTPRoute via parentRefs
  namespace: retry-demo
spec:
  # ─────────────────────────────────────────────────────────────────────────
  # GATEWAY CLASS: Use Istio as the Gateway API implementation
  # ─────────────────────────────────────────────────────────────────────────
  gatewayClassName: istio

  # ─────────────────────────────────────────────────────────────────────────
  # LISTENERS: Port, protocol, and host configurations
  # ─────────────────────────────────────────────────────────────────────────
  listeners:
    - name: http # Listener name
      port: 80 # Listen on HTTP port 80
      protocol: HTTP # Protocol type
      hostname: "*.example.com" # Accept traffic for subdomains
      allowedRoutes:
        namespaces:
          from: Same # Only allow routes from the same namespace
