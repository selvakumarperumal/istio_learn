# ============================================================================
# HTTP ROUTE: Retries and Timeouts Configuration (Gateway API)
# ============================================================================
# PURPOSE:
#   Demonstrates retry and timeout capabilities using Gateway API HTTPRoute
#   with Istio extensions. Timeouts are natively supported in Gateway API.
#   For retries, Istio provides extension annotations.
#
# HOW RETRIES WORK IN ENVOY:
#   ┌────────┐     ┌────────────────────────────────────────────┐     ┌─────────┐
#   │ Client │────▶│ Envoy Proxy                                │────▶│ httpbin │
#   └────────┘     │                                            │     └─────────┘
#                  │  Attempt 1: Send request                   │
#                  │    ← Got 503? Check retryOn conditions     │
#                  │    ← Matches "5xx"? YES → retry!           │
#                  │                                            │
#                  │  Attempt 2: Wait (exponential backoff) →   │
#                  │    Send request again                      │
#                  │    ← Got 503 again? Still matches → retry! │
#                  │                                            │
#                  │  Attempt 3: Wait (longer backoff) →        │
#                  │    Send request again                      │
#                  │    ← Got 200? SUCCESS → return to client   │
#                  │    ← Got 503? No more attempts → return 503│
#                  └────────────────────────────────────────────┘
#
# TIMEOUT vs PER-TRY TIMEOUT:
#   ┌─────────────── timeout: 10s (overall budget) ──────────────────┐
#   │                                                                 │
#   │  ┌── perTryTimeout: 2s ──┐  ┌── perTryTimeout: 2s ──┐        │
#   │  │  Attempt 1            │  │  Attempt 2            │  ...    │
#   │  └───────────────────────┘  └───────────────────────┘        │
#   │                                                                 │
#   │  If total time exceeds 10s, ALL retries are cancelled           │
#   └─────────────────────────────────────────────────────────────────┘
#
# GATEWAY API TIMEOUT SUPPORT:
#   HTTPRoute natively supports:
#     - spec.rules[].timeouts.request  → Overall request timeout
#     - spec.rules[].timeouts.backendRequest → Per-backend timeout
#
#   For retry policies, we use Istio annotations on the HTTPRoute.
#
# TESTING:
#   # Test 1: Timeout exceeded (delay > timeout → returns 504)
#   time curl http://httpbin:80/delay/15
#
#   # Test 2: Normal response (delay < timeout → returns 200)
#   time curl http://httpbin:80/delay/1
#
#   # Test 3: Retries on 503
#   curl http://httpbin:80/status/503
#
# RELATED FILES:
#   - deployment.yaml : The httpbin target service
#   - gateway.yaml    : Gateway API external access
# ============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-resilience
  namespace: retry-demo
  annotations:
    # ─────────────────────────────────────────────────────────────────────────
    # ISTIO RETRY EXTENSIONS: Configure retries via Istio annotations
    # ─────────────────────────────────────────────────────────────────────────
    # Gateway API does not natively support retries, so Istio provides
    # these annotations to configure retry behavior on HTTPRoute resources.
    retry.istio.io/attempts: "3"
    retry.istio.io/per-try-timeout: "2s"
    retry.istio.io/retry-on: "5xx,reset,connect-failure,retriable-4xx"
spec:
  # ─────────────────────────────────────────────────────────────────────────
  # PARENT REFS: Attach this route to the Gateway
  # ─────────────────────────────────────────────────────────────────────────
  parentRefs:
    - name: httpbin-gateway
      sectionName: http

  # ─────────────────────────────────────────────────────────────────────────
  # HOSTNAMES: Which hostnames does this route match?
  # ─────────────────────────────────────────────────────────────────────────
  hostnames:
    - httpbin.example.com

  rules:
    # ═══════════════════════════════════════════════════════════════════════
    # ROUTE: All traffic with timeout policy
    # ═══════════════════════════════════════════════════════════════════════
    - backendRefs:
        - name: httpbin
          port: 80

      # ─────────────────────────────────────────────────────────────────────
      # TIMEOUTS: Gateway API native timeout support
      # ─────────────────────────────────────────────────────────────────────
      # request: Overall request timeout (includes ALL retries)
      #   This is the maximum total time from when the client sends the
      #   request to when it receives a response (or timeout error).
      #
      # backendRequest: Per-backend timeout (similar to perTryTimeout)
      #   Maximum time to wait for each individual backend attempt.
      #
      # IMPORTANT: request should be > (retry attempts + 1) × backendRequest
      #   Here: 10s > (3 + 1) × 2s = 8s ✓ (allows time for all retries)
      timeouts:
        request: 10s # Total time budget for request + all retries
        backendRequest: 2s # Each attempt times out after 2 seconds
