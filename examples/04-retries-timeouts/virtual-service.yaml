# ============================================================================
# RETRIES AND TIMEOUTS CONFIGURATION
# ============================================================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: httpbin-resilience
  namespace: retry-demo
spec:
  hosts:
    - httpbin
    - httpbin.example.com
  gateways:
    - httpbin-gateway
    - mesh
  http:
    # ═══════════════════════════════════════════════════════════════════════
    # Request with retries enabled
    # ═══════════════════════════════════════════════════════════════════════
    - route:
        - destination:
            host: httpbin
            port:
              number: 80
      retries:
        attempts: 3 # Retry up to 3 times
        perTryTimeout: 2s # Each attempt times out after 2s
        retryOn: 5xx,reset,connect-failure,retriable-4xx
      timeout: 10s # Total request timeout
