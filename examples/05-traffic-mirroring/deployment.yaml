# Production v1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-v1
  namespace: mirror-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
      version: v1
  template:
    metadata:
      labels:
        app: httpbin
        version: v1
    spec:
      containers:
        - name: httpbin
          image: kennethreitz/httpbin
          ports:
            - containerPort: 80
---
# Canary v2 (receives mirrored traffic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-v2
  namespace: mirror-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
      version: v2
  template:
    metadata:
      labels:
        app: httpbin
        version: v2
    spec:
      containers:
        - name: httpbin
          image: kennethreitz/httpbin
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: mirror-demo
spec:
  ports:
    - port: 80
      name: http
  selector:
    app: httpbin
