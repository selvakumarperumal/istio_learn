# Two services to test mTLS between them
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: mtls-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      containers:
        - name: httpbin
          image: kennethreitz/httpbin
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: mtls-demo
spec:
  ports:
    - port: 80
      name: http
  selector:
    app: httpbin
---
# Sleep client for testing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleep
  namespace: mtls-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sleep
  template:
    metadata:
      labels:
        app: sleep
    spec:
      containers:
        - name: sleep
          image: curlimages/curl
          command: ["sleep", "infinity"]
