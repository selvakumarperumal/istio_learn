# ============================================================================
# DEPLOYMENTS: httpbin + sleep with ServiceAccounts for Authorization Demo
# ============================================================================
# PURPOSE:
#   Deploy services with distinct ServiceAccounts to demonstrate Istio's
#   authorization policies. ServiceAccounts provide the IDENTITY used in
#   AuthorizationPolicy rules.
#
# WHY SERVICEACCOUNTS MATTER:
#   Istio identifies each workload by its ServiceAccount:
#   - httpbin pod → cluster.local/ns/authz-demo/sa/httpbin
#   - sleep pod   → cluster.local/ns/authz-demo/sa/sleep
#
#   AuthorizationPolicy uses these identities to control who can access what.
#
# ZERO TRUST FLOW:
#   1. Deploy with deny-all policy → All access blocked
#   2. Add allow-sleep policy → Only sleep can access httpbin
#   3. Other services remain blocked
#
# HOW TO TEST:
#   # Test from sleep (should work after allow policy is applied)
#   $ kubectl exec deploy/sleep -n authz-demo -- curl http://httpbin:80/get
#
#   # Test from another namespace (should be denied)
#   $ kubectl exec deploy/some-pod -n other-ns -- curl http://httpbin.authz-demo:80/get
#
# RELATED FILES:
#   - authz-deny-all.yaml: Blocks all traffic (apply first)
#   - authz-allow-specific.yaml: Allows only sleep → httpbin GET requests
# ============================================================================

# ════════════════════════════════════════════════════════════════════════════
# httpbin: Protected Backend Service
# ════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: authz-demo
  labels:
    app: httpbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      serviceAccountName: httpbin # Critical! Gives this pod its identity
      containers:
        - name: httpbin
          image: kong/httpbin
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "200m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
# ════════════════════════════════════════════════════════════════════════════
# ServiceAccount for httpbin
# ════════════════════════════════════════════════════════════════════════════
# Identity: cluster.local/ns/authz-demo/sa/httpbin
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: authz-demo
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: authz-demo
spec:
  ports:
    - port: 80
      name: http
  selector:
    app: httpbin
---
# ════════════════════════════════════════════════════════════════════════════
# sleep: Client Service (makes requests to httpbin)
# ════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleep
  namespace: authz-demo
  labels:
    app: sleep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sleep
  template:
    metadata:
      labels:
        app: sleep
    spec:
      serviceAccountName: sleep # Critical! AuthorizationPolicy checks this
      containers:
        - name: sleep
          image: curlimages/curl
          command: ["sleep", "infinity"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "64Mi"
              cpu: "100m"
---
# ════════════════════════════════════════════════════════════════════════════
# ServiceAccount for sleep
# ════════════════════════════════════════════════════════════════════════════
# Identity: cluster.local/ns/authz-demo/sa/sleep
# This identity is referenced in authz-allow-specific.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sleep
  namespace: authz-demo
