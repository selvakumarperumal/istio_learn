# ============================================================================
# DEPLOYMENT & SERVICE: httpbin - JWT-Protected Service
# ============================================================================
# PURPOSE:
#   Deploy httpbin as the target service protected by JWT authentication.
#   All requests to this service will require a valid JWT token.
#
# HOW TO TEST JWT AUTH:
#   1. Deploy all resources:
#      $ ./deploy-all.sh
#
#   2. Get the gateway URL:
#      $ export GATEWAY=$(kubectl get gateway httpbin-gateway -n jwt-demo -o jsonpath='{.status.addresses[0].value}')
#
#   3. Test WITHOUT token (should be rejected):
#      $ curl -v http://$GATEWAY/headers
#      # Result: 403 Forbidden
#
#   4. Get a sample JWT token:
#      $ TOKEN=$(curl -s https://raw.githubusercontent.com/istio/istio/release-1.29/security/tools/jwt/samples/demo.jwt)
#
#   5. Test WITH valid token (should succeed):
#      $ curl -H "Authorization: Bearer $TOKEN" http://$GATEWAY/headers
#      # Result: 200 OK with headers echoed back
#
# RELATED FILES:
#   - requestauthentication.yaml: Validates JWT signature and claims
#   - authorizationpolicy.yaml: Requires valid JWT for access
#   - gateway.yaml: Ingress configuration
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: jwt-demo
  labels:
    app: httpbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      containers:
        - name: httpbin
          image: kong/httpbin
          ports:
            - containerPort: 80
          # ──────────────────────────────────────────────────────────────────
          # RESOURCES: Prevent pod starvation
          # ──────────────────────────────────────────────────────────────────
          resources:
            requests:
              memory: "128Mi"
              cpu: "200m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: jwt-demo
spec:
  ports:
    - port: 80
      name: http
  selector:
    app: httpbin
