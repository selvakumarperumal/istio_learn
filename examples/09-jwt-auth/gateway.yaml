# ============================================================================
# GATEWAY & HTTPROUTE: External Access for JWT Auth Demo (Gateway API)
# ============================================================================
# PURPOSE:
#   Configure Kubernetes Gateway API to accept external HTTP traffic for
#   testing JWT authentication. The RequestAuthentication policy will
#   validate tokens at this entry point.
#
# JWT AUTH FLOW:
#   External Client → Gateway (Gateway API) → HTTPRoute → httpbin
#                          ↓                        ↓
#                    Gateway Config          RequestAuthentication
#                                            + AuthorizationPolicy
#
# NOTE: RequestAuthentication and AuthorizationPolicy are Istio-specific
#   resources that work with Gateway API Gateways automatically.
#
# RELATED FILES:
#   - requestauthentication.yaml: Defines JWT validation rules
#   - authorizationpolicy.yaml: Enforces JWT requirement
# ============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: httpbin-gateway
  namespace: jwt-demo
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same # Only allow routes from same namespace
---
# ============================================================================
# HTTP ROUTE: Route traffic to httpbin (Gateway API)
# ============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: jwt-demo
spec:
  parentRefs:
    - name: httpbin-gateway
      sectionName: http
  rules:
    - backendRefs:
        - name: httpbin
          port: 80
