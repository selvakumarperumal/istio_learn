# Test client
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleep
  namespace: egress-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sleep
  template:
    metadata:
      labels:
        app: sleep
    spec:
      containers:
        - name: sleep
          image: curlimages/curl
          command: ["sleep", "infinity"]
