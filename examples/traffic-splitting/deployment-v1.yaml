# ============================================================================
# DEPLOYMENT: REVIEWS SERVICE VERSION 1
# ============================================================================
#
# 📌 What is this file?
# ---------------------
# This Deployment creates 3 replicas of version 1 of the "reviews" service.
# In our traffic-splitting demo, this version will receive 80% of traffic.
#
# 🏗️ Architecture Overview:
# -------------------------
#
#   ┌──────────────────────────────────────────────────────────────────────┐
#   │                     reviews-v1 Deployment                            │
#   │                                                                      │
#   │   ReplicaSet (managed by Deployment)                                │
#   │   ┌────────────────────────────────────────────────────────────────┐ │
#   │   │                                                                │ │
#   │   │  ┌─────────────┐  ┌─────────────┐  ┌─────────────┐           │ │
#   │   │  │   Pod 1     │  │   Pod 2     │  │   Pod 3     │           │ │
#   │   │  │             │  │             │  │             │           │ │
#   │   │  │ app:myapp   │  │ app:myapp   │  │ app:myapp   │           │ │
#   │   │  │ version:v1  │  │ version:v1  │  │ version:v1  │           │ │
#   │   │  └─────────────┘  └─────────────┘  └─────────────┘           │ │
#   │   │       3 replicas of version 1                                 │ │
#   │   └────────────────────────────────────────────────────────────────┘ │
#   │                                                                      │
#   │   Labels on pods:                                                   │
#   │   - app: myapp        ← Used by Kubernetes Service selector        │
#   │   - version: v1       ← Used by Istio DestinationRule subset       │
#   └──────────────────────────────────────────────────────────────────────┘
#
# ============================================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: reviews-v1
  namespace: traffic-demo

  labels:
    app: myapp
    version: v1

spec:
  replicas: 3

  selector:
    matchLabels:
      app: myapp
      version: v1

  template:
    metadata:
      labels:
        # ┌───────────────────────────────────────────────────────────────┐
        # │ IMPORTANT: These labels are CRITICAL for traffic routing!    │
        # ├───────────────────────────────────────────────────────────────┤
        # │                                                               │
        # │   app: myapp                                                 │
        # │   └── Used by Kubernetes Service to find pods                │
        # │   └── Service selector: app=myapp (matches both v1 & v2)     │
        # │   └── NOTE: Service NAME is "reviews-svc", NOT "myapp"!      │
        # │                                                               │
        # │   version: v1                                                │
        # │   └── Used by Istio DestinationRule to define subsets        │
        # │   └── DestinationRule subset v1: version=v1                  │
        # │   └── Allows VirtualService to route to specific version     │
        # │                                                               │
        # └───────────────────────────────────────────────────────────────┘
        app: myapp # ◄──── Matched by Service selector
        version: v1 # ◄──── Matched by DestinationRule subset

    spec:
      containers:
        - name: reviews
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo 'server { 
                listen 80; 
                location /version { return 200 "Version: v1\n"; } 
                location /health { return 200 "OK"; } 
                location / { return 200 "Reviews Service v1\n"; } 
              }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
