# ============================================================================
# DEPLOYMENT: REVIEWS SERVICE VERSION 2 (CANARY)
# ============================================================================
#
# 📌 What is this file?
# ---------------------
# This Deployment creates 1 replica of version 2 of the "reviews" service.
# In our traffic-splitting demo, this version will receive 20% of traffic.
# This is a "canary deployment" pattern.
#
# 🐤 What is Canary Deployment?
# -----------------------------
# Named after "canary in a coal mine" - miners used canaries to detect
# dangerous gases. If the canary was affected, miners knew to evacuate.
#
# In software, a canary deployment means:
# - Deploy new version alongside old version
# - Route small % of traffic to new version
# - Monitor for errors/problems
# - If issues: rollback instantly (just route 100% to old version)
# - If stable: gradually increase traffic to new version
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │           CANARY DEPLOYMENT: TRAFFIC PROGRESSION                        │
# ├─────────────────────────────────────────────────────────────────────────┤
# │                                                                         │
# │   Stage 1: Initial Canary (this example)                               │
# │   ┌─────────────────────────────────────────────────────────────────┐  │
# │   │    v1: 80%  ████████████████████████                           │  │
# │   │    v2: 20%  ██████                                              │  │
# │   └─────────────────────────────────────────────────────────────────┘  │
# │                                                                         │
# │   Stage 2: Increase if stable                                          │
# │   ┌─────────────────────────────────────────────────────────────────┐  │
# │   │    v1: 50%  ███████████████                                    │  │
# │   │    v2: 50%  ███████████████                                    │  │
# │   └─────────────────────────────────────────────────────────────────┘  │
# │                                                                         │
# │   Stage 3: Complete migration                                          │
# │   ┌─────────────────────────────────────────────────────────────────┐  │
# │   │    v1: 0%                                                       │  │
# │   │    v2: 100% ██████████████████████████████                      │  │
# │   └─────────────────────────────────────────────────────────────────┘  │
# │                                                                         │
# └─────────────────────────────────────────────────────────────────────────┘
#
# 🎯 Why only 1 replica for v2?
# -----------------------------
# - v2 only receives 20% of traffic
# - 1 replica is enough to handle the load
# - Saves cluster resources during testing
# - If v2 proves stable, scale up replicas before increasing traffic %
#
# ============================================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: reviews-v2 # Different name from v1 deployment
  namespace: traffic-demo

  labels:
    app: reviews # Same app as v1
    version: v2 # Different version label

spec:
  # ═══════════════════════════════════════════════════════════════════════
  # REPLICA COUNT - CANARY SIZE
  # ═══════════════════════════════════════════════════════════════════════
  # Only 1 replica for canary testing
  # This is sufficient for 20% of traffic
  #
  # Scaling strategy:
  # - Start with 1 replica (canary)
  # - If stable, increase to match v1 replicas
  # - Then increase traffic percentage
  replicas: 1

  selector:
    matchLabels:
      app: reviews
      version: v2 # Must match pods for v2

  template:
    metadata:
      labels:
        # ┌───────────────────────────────────────────────────────────────┐
        # │ LABEL RELATIONSHIP FOR TRAFFIC ROUTING:                       │
        # ├───────────────────────────────────────────────────────────────┤
        # │                                                               │
        # │   Kubernetes Service               Istio DestinationRule     │
        # │   selector: app=reviews   -->      subset v2: version=v2     │
        # │          │                                │                   │
        # │          │                                │                   │
        # │          ▼                                ▼                   │
        # │   Matches BOTH          VirtualService routes    │
        # │   v1 and v2 pods        to specific subset       │
        # │                                                               │
        # │   Result: Service sees all pods,                              │
        # │           Istio controls which pods get traffic               │
        # └───────────────────────────────────────────────────────────────┘
        app: reviews
        version:
          v2 # Different from v1 - this is how Istio knows
          # which pods belong to which version

    spec:
      containers:
        - name: reviews

          image: nginx:alpine

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          # ═════════════════════════════════════════════════════════════════
          # CUSTOM RESPONSE FOR V2
          # ═════════════════════════════════════════════════════════════════
          # Returns "Version: v2" to identify canary responses
          # In real deployment, this could be:
          # - New feature implementation
          # - Bug fix
          # - Performance improvement
          # - UI change
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo 'server { 
                listen 80; 
                location /version { return 200 "Version: v2\n"; } 
                location /health { return 200 "OK"; } 
                location / { return 200 "Reviews Service v2 - NEW FEATURES!\n"; } 
              }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
