# ============================================================================
# DEPLOYMENT: REVIEWS SERVICE VERSION 2 (CANARY)
# ============================================================================
#
# 📌 What is this file?
# ---------------------
# This Deployment creates 1 replica of version 2 of the "reviews" service.
# In our traffic-splitting demo, this version will receive 20% of traffic.
# This is a "canary deployment" pattern.
#
# ============================================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: reviews-v2
  namespace: traffic-demo

  labels:
    app: myapp
    version: v2

spec:
  replicas: 1

  selector:
    matchLabels:
      app: myapp
      version: v2

  template:
    metadata:
      labels:
        # ┌───────────────────────────────────────────────────────────────┐
        # │   app: myapp      ← Matched by Service selector              │
        # │   version: v2     ← Matched by DestinationRule subset        │
        # └───────────────────────────────────────────────────────────────┘
        app: myapp # ◄──── Same as v1, both matched by Service
        version: v2 # ◄──── Different from v1, for subset routing

    spec:
      containers:
        - name: reviews
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo 'server { 
                listen 80; 
                location /version { return 200 "Version: v2\n"; } 
                location /health { return 200 "OK"; } 
                location / { return 200 "Reviews Service v2 - NEW FEATURES!\n"; } 
              }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
