# ============================================================================
# DESTINATION RULE: DEFINES VERSION SUBSETS
# ============================================================================
#
# 📌 What is this file?
# ---------------------
# A DestinationRule defines policies that apply to traffic destined for a
# service. Most importantly, it defines SUBSETS - named versions of the
# service that VirtualService can route to.
#
# 🤔 Why do we need DestinationRule?
# -----------------------------------
# The Kubernetes Service sees all pods equally. It doesn't know about versions.
# DestinationRule tells Istio: "These pods are v1, these pods are v2"
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │                                                                         │
# │   Without DestinationRule:          With DestinationRule:               │
# │                                                                         │
# │   ┌─────────────────────┐          ┌─────────────────────┐              │
# │   │     All pods        │          │    Subset: v1       │              │
# │   │  ┌───┐ ┌───┐ ┌───┐  │          │  ┌───┐ ┌───┐ ┌───┐  │              │
# │   │  │v1 │ │v1 │ │v2 │  │          │  │v1 │ │v1 │ │v1 │  │              │
# │   │  └───┘ └───┘ └───┘  │          │  └───┘ └───┘ └───┘  │              │
# │   │                     │          └─────────────────────┘              │
# │   │  Istio sees:        │                                               │
# │   │  "3 identical pods" │          ┌─────────────────────┐              │
# │   └─────────────────────┘          │    Subset: v2       │              │
# │                                    │  ┌───┐              │              │
# │   ✗ Cannot route by version        │  │v2 │              │              │
# │                                    │  └───┘              │              │
# │                                    └─────────────────────┘              │
# │                                                                         │
# │                                    ✓ VirtualService can now route       │
# │                                      to specific subsets                │
# │                                                                         │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ============================================================================
# 📍 NAMING CLARIFICATION - VERY IMPORTANT!
# ============================================================================
#
#   ┌─────────────────────────────────────────────────────────────────────┐
#   │                                                                     │
#   │   We use DIFFERENT names to show what matches what:                 │
#   │                                                                     │
#   │   ┌─────────────────────────────────────────────────────────────┐   │
#   │   │  Service NAME:        reviews-svc                           │   │
#   │   │  Service SELECTOR:    app: myapp                            │   │
#   │   │  Pod LABEL:           app: myapp, version: v1               │   │
#   │   │  DestinationRule HOST: reviews-svc                          │   │
#   │   │  DestinationRule SUBSET: version: v1                        │   │
#   │   └─────────────────────────────────────────────────────────────┘   │
#   │                                                                     │
#   │   HOW MATCHING WORKS:                                               │
#   │                                                                     │
#   │   ┌────────────────────┐                                           │
#   │   │  DestinationRule   │                                           │
#   │   │  host: reviews-svc │ ──────┐  Matches by SERVICE NAME          │
#   │   └────────────────────┘       │                                   │
#   │                                ▼                                   │
#   │   ┌────────────────────────────────────────────────────────────┐   │
#   │   │  Service                                                   │   │
#   │   │  name: reviews-svc      ◄──── host matches THIS (by name) │   │
#   │   │  selector:                                                 │   │
#   │   │    app: myapp           ◄──── finds pods with this LABEL  │   │
#   │   └────────────────────────────────────────────────────────────┘   │
#   │                                │                                   │
#   │                                ▼                                   │
#   │   ┌────────────────────────────────────────────────────────────┐   │
#   │   │  Pods                                                      │   │
#   │   │  labels:                                                   │   │
#   │   │    app: myapp      ◄──── Matched by Service selector       │   │
#   │   │    version: v1     ◄──── Matched by DestinationRule subset │   │
#   │   └────────────────────────────────────────────────────────────┘   │
#   │                                                                     │
#   │   SUMMARY:                                                          │
#   │   ─────────────────────────────────────────────────────────────     │
#   │   host: reviews-svc   →  matches Service NAME (metadata.name)      │
#   │   app: myapp          →  Pod LABEL (matched by Service selector)   │
#   │   version: v1         →  Pod LABEL (matched by subset)             │
#   │                                                                     │
#   │   They are ALL DIFFERENT values! No confusion now! 🎉              │
#   │                                                                     │
#   └─────────────────────────────────────────────────────────────────────┘
#
# ============================================================================

apiVersion: networking.istio.io/v1beta1
kind: DestinationRule

metadata:
  name: reviews-destination
  namespace: traffic-demo

spec:
  # ═══════════════════════════════════════════════════════════════════════
  # HOST - Which service does this rule apply to?
  # ═══════════════════════════════════════════════════════════════════════
  #
  # This is the SERVICE NAME, not a pod label!
  # It matches: metadata.name in service.yaml (which is "reviews-svc")
  #
  host: reviews-svc # ◄──── Matches Service NAME, NOT app label!

  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
    loadBalancer:
      simple: ROUND_ROBIN

  # ═══════════════════════════════════════════════════════════════════════
  # SUBSETS - Named groups of pods within the service
  # ═══════════════════════════════════════════════════════════════════════
  #
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │  WHY NO "app: myapp" IN SUBSETS?                                    │
  # ├─────────────────────────────────────────────────────────────────────┤
  # │                                                                     │
  # │  Because "host: reviews-svc" already points to the Service,        │
  # │  and the Service already filters by "app: myapp".                   │
  # │                                                                     │
  # │  Subset labels are ADDITIONAL filters:                              │
  # │                                                                     │
  # │  Service (reviews-svc):  app=myapp   →  finds 4 pods               │
  # │                             +                                       │
  # │  Subset v1:              version=v1  →  filters to 3 pods          │
  # │                             =                                       │
  # │  Result:                 app=myapp AND version=v1                  │
  # │                                                                     │
  # └─────────────────────────────────────────────────────────────────────┘
  #
  # ============================================================================
  # 🐤 CANARY DEPLOYMENT PATTERN
  # ============================================================================
  #
  # A canary deployment is a technique to reduce risk when deploying new
  # software versions. Named after the "canary in a coal mine" concept.
  #
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │                                                                     │
  # │   CANARY RELEASE STRATEGY                                           │
  # │   ═══════════════════════                                           │
  # │                                                                     │
  # │   Phase 1: Initial Canary (Current State)                           │
  # │   ─────────────────────────────────────────                         │
  # │                                                                     │
  # │   ┌────────────────────────────────┐  ┌────────────┐               │
  # │   │         v1 (Stable)            │  │ v2 (Canary)│               │
  # │   │   ┌───┐ ┌───┐ ┌───┐           │  │   ┌───┐    │               │
  # │   │   │ P │ │ P │ │ P │           │  │   │ P │    │               │
  # │   │   └───┘ └───┘ └───┘           │  │   └───┘    │               │
  # │   │      3 pods (80%)              │  │ 1 pod (20%)│               │
  # │   └────────────────────────────────┘  └────────────┘               │
  # │                                                                     │
  # │   If v2 performs well...                                           │
  # │                                                                     │
  # │   Phase 2: Increase Canary Traffic (50/50)                          │
  # │   ─────────────────────────────────────────                         │
  # │   Update VirtualService: weight v1=50, v2=50                        │
  # │                                                                     │
  # │   Phase 3: Full Rollout (0/100)                                     │
  # │   ─────────────────────────────────────────                         │
  # │   Update VirtualService: weight v1=0, v2=100                        │
  # │   Then scale down v1 deployment                                     │
  # │                                                                     │
  # │   If v2 has problems at any phase...                                │
  # │   ─────────────────────────────────────                             │
  # │   Instant rollback: Set weight v1=100, v2=0                         │
  # │   No downtime! No redeployment needed!                              │
  # │                                                                     │
  # └─────────────────────────────────────────────────────────────────────┘
  #
  subsets:
    # ─────────────────────────────────────────────────────────────────────
    # SUBSET: v1 (Production/Stable version)
    # ─────────────────────────────────────────────────────────────────────
    #
    # This is your STABLE, battle-tested version
    # VirtualService routes 80% of traffic here
    #
    # In production, this might be:
    # - The version that's been running for months
    # - Fully tested and validated
    # - Known to be reliable
    #
    - name: v1 # Subset name (referenced by VirtualService)
      labels:
        version:
          v1 # Only pods with version=v1
          # (app=myapp is already filtered by Service)

      # Optional: Override traffic policy for this subset
      # Example: More conservative settings for stable version
      # trafficPolicy:
      #   connectionPool:
      #     tcp:
      #       maxConnections: 200  # Higher limit for stable version
      #     http:
      #       http2MaxRequests: 2000
      #   loadBalancer:
      #     simple: LEAST_CONN    # Different load balancing

    # ─────────────────────────────────────────────────────────────────────
    # SUBSET: v2 (Canary/New version)
    # ─────────────────────────────────────────────────────────────────────
    #
    # This is your NEW version being tested
    # VirtualService routes 20% of traffic here (the "canary")
    #
    # Why 20%?
    # - Low enough to minimize impact if bugs exist
    # - High enough to get meaningful traffic and metrics
    # - Easy to calculate: 1 out of 5 requests goes to canary
    #
    # What to monitor during canary:
    # - Error rates (should match or be lower than v1)
    # - Latency (should match or be better than v1)
    # - Resource usage (CPU, memory)
    # - Business metrics (conversion rates, etc.)
    #
    - name: v2 # Subset name
      labels:
        version: v2 # Only pods with version=v2


      # Optional: More strict settings for canary (catch issues faster)
      # trafficPolicy:
      #   connectionPool:
      #     tcp:
      #       maxConnections: 50   # Lower limit for canary
      #     http:
      #       http2MaxRequests: 500
      #   outlierDetection:        # Fast failure detection
      #     consecutive5xxErrors: 3
      #     interval: 10s
      #     baseEjectionTime: 30s
# ============================================================================
# 📊 TRAFFIC PROGRESSION EXAMPLES
# ============================================================================
#
# To change traffic split, update VirtualService weights:
#
#   # Increase canary to 50%
#   kubectl patch vs reviews-routing -n traffic-demo --type=merge -p '
#   spec:
#     http:
#     - route:
#       - destination:
#           host: reviews-svc
#           subset: v1
#         weight: 50
#       - destination:
#           host: reviews-svc
#           subset: v2
#         weight: 50'
#
#   # Full rollout to v2
#   kubectl patch vs reviews-routing -n traffic-demo --type=merge -p '
#   spec:
#     http:
#     - route:
#       - destination:
#           host: reviews-svc
#           subset: v2
#         weight: 100'
#
#   # Rollback to v1
#   kubectl patch vs reviews-routing -n traffic-demo --type=merge -p '
#   spec:
#     http:
#     - route:
#       - destination:
#           host: reviews-svc
#           subset: v1
#         weight: 100'
#
# ============================================================================
