# ============================================================================
# KUBERNETES GATEWAY API: EXTERNAL ACCESS POINT
# ============================================================================
#
# 📌 What is this file?
# ---------------------
# A Gateway configures a load balancer operating at the edge of the mesh.
# It's the entry point for external traffic into the service mesh.
#
# 🚪 Istio Gateway vs Kubernetes Gateway API:
# ---------------------------------------------
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │                                                                         │
# │   Istio Gateway (OLD):               Kubernetes Gateway API (NEW):     │
# │   ───────────────────                ──────────────────────────────    │
# │                                                                         │
# │   ┌─────────────────┐               ┌─────────────────┐                │
# │   │    Gateway      │               │    Gateway      │                │
# │   │  (L4-L7 config) │──┐            │  (K8s standard) │──┐             │
# │   └─────────────────┘  │            └─────────────────┘  │             │
# │   + VirtualService     │            + HTTPRoute           │             │
# │   ┌─────────────────┐  │            ┌─────────────────┐  │             │
# │   │ VirtualService  │──┘            │   HTTPRoute     │──┘             │
# │   │ (L7 routing)    │               │ (L7 routing)    │                │
# │   └─────────────────┘               └─────────────────┘                │
# │                                                                         │
# │   ✗ Istio-specific                  ✓ Standard Kubernetes API          │
# │   ✗ Vendor lock-in                  ✓ Portable across implementations │
# │                                     ✓ Role-oriented design             │
# │                                     ✓ Supported by Istio 1.15+        │
# │                                                                         │
# └─────────────────────────────────────────────────────────────────────────┘
#
# 🔄 How Gateway API Works:
# --------------------------
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │                                                                         │
# │                    EXTERNAL TRAFFIC FLOW                                │
# │                                                                         │
# │   Internet                                                              │
# │      │                                                                  │
# │      ▼                                                                  │
# │   ┌──────────────────────────────────────────────────────────────────┐ │
# │   │  Gateway Resource (THIS FILE)                                    │ │
# │   │  - gatewayClassName: istio (Istio provisions the proxy)          │ │
# │   │  - listeners: port 80, HTTP, hostname *.example.com              │ │
# │   └──────────────────────────────┬───────────────────────────────────┘ │
# │                                  │                                      │
# │                                  ▼                                      │
# │   ┌──────────────────────────────────────────────────────────────────┐ │
# │   │  HTTPRoute                                                       │ │
# │   │  - Defines routing rules                                         │ │
# │   │  - "Route to v1 (80%) and v2 (20%)"                              │ │
# │   └──────────────────────────────┬───────────────────────────────────┘ │
# │                                  │                                      │
# │                     ┌────────────┴────────────┐                        │
# │                     │                         │                        │
# │                ┌────▼────┐              ┌────▼────┐                    │
# │                │   v1    │              │   v2    │                    │
# │                │  pods   │              │  pods   │                    │
# │                └─────────┘              └─────────┘                    │
# │                                                                         │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: reviews-gateway # Gateway name (referenced by HTTPRoute parentRefs)
  namespace: traffic-demo # Namespace for this resource

spec:
  # ═══════════════════════════════════════════════════════════════════════
  # GATEWAY CLASS - Which implementation should handle this Gateway?
  # ═══════════════════════════════════════════════════════════════════════
  #
  # gatewayClassName replaces the old Istio "selector" approach.
  # Setting it to "istio" tells Kubernetes to use Istio as the
  # Gateway API implementation, which automatically provisions
  # the required Envoy proxy/load balancer.
  #
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │                                                                     │
  # │   OLD (Istio Gateway):          NEW (Gateway API):                 │
  # │   ───────────────────          ──────────────────                  │
  # │                                                                     │
  # │   selector:                     gatewayClassName: istio             │
  # │     istio: ingressgateway                                          │
  # │                                 Istio auto-provisions the proxy    │
  # │   "Find pods with that label"   "Istio handles everything"         │
  # │                                                                     │
  # └─────────────────────────────────────────────────────────────────────┘
  #
  gatewayClassName: istio

  # ═══════════════════════════════════════════════════════════════════════
  # LISTENERS - Define which ports/protocols/hosts this gateway handles
  # ═══════════════════════════════════════════════════════════════════════
  #
  # Each listener configures a port and what traffic to accept.
  # This replaces the old "servers" array.
  #
  listeners:
    # ─────────────────────────────────────────────────────────────────────
    # HTTP LISTENER (Port 80)
    # ─────────────────────────────────────────────────────────────────────
    - name: http # Listener name (HTTPRoute references via sectionName)
      port: 80 # Port number to listen on
      protocol: HTTP # Protocol (HTTP, HTTPS, TLS, TCP)

      # ─────────────────────────────────────────────────────────────────────
      # HOSTNAME - Which hostnames does this listener accept?
      # ─────────────────────────────────────────────────────────────────────
      #
      # ┌─────────────────────────────────────────────────────────────────┐
      # │                                                                 │
      # │   Host matching rules:                                          │
      # │                                                                 │
      # │   "reviews.example.com"                                         │
      # │    └── Exact match - only this hostname                        │
      # │                                                                 │
      # │   "*.example.com"                                               │
      # │    └── Wildcard - any subdomain of example.com                 │
      # │                                                                 │
      # │   (omitted)                                                     │
      # │    └── Accept all hosts (useful for testing)                   │
      # │                                                                 │
      # └─────────────────────────────────────────────────────────────────┘
      #
      hostname: "*.example.com" # Accept traffic for subdomains

      # ─────────────────────────────────────────────────────────────────────
      # ALLOWED ROUTES - Which namespaces can attach HTTPRoutes?
      # ─────────────────────────────────────────────────────────────────────
      allowedRoutes:
        namespaces:
          from: Same # Only allow HTTPRoutes from the same namespace
# ============================================================================
# HTTPS/TLS CONFIGURATION (Optional - for production)
# ============================================================================
#
# To enable HTTPS, add another listener:
#
#   - name: https
#     port: 443
#     protocol: HTTPS
#     hostname: reviews.example.com
#     tls:
#       mode: Terminate
#       certificateRefs:
#         - kind: Secret
#           name: reviews-cert
#     allowedRoutes:
#       namespaces:
#         from: Same
#
# The Secret should contain:
#   - tls.crt: Server certificate
#   - tls.key: Private key
#
# Create with:
#   kubectl create secret tls reviews-cert \
#     --cert=server.crt \
#     --key=server.key \
#     -n traffic-demo
#
# ============================================================================
