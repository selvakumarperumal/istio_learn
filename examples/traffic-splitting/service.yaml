# ============================================================================
# KUBERNETES SERVICE FOR REVIEWS
# ============================================================================
#
# 📌 What is this file?
# ---------------------
# This Service provides a stable network endpoint for the reviews application.
# It routes traffic to ALL pods with the label "app: reviews" (both v1 & v2).
# The actual version-specific routing is handled by Istio, not Kubernetes.
#
# 🔄 Service vs VirtualService - Who Does What?
# ----------------------------------------------
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │                                                                         │
# │   Kubernetes Service                    Istio VirtualService            │
# │   ─────────────────────                 ────────────────────            │
# │                                                                         │
# │   ✓ Provides DNS name                  ✓ Traffic splitting (80/20)     │
# │     (reviews.traffic-demo.svc)           between versions              │
# │                                                                         │
# │   ✓ Load balances across               ✓ Header-based routing          │
# │     all matching pods                                                   │
# │                                        ✓ Retries, timeouts             │
# │   ✓ Creates Endpoints                                                  │
# │     (list of pod IPs)                  ✓ Fault injection               │
# │                                                                         │
# │   ✗ Cannot route by version            ✓ Routes to specific versions  │
# │   ✗ No traffic splitting               ✓ Full traffic control          │
# │                                                                         │
# └─────────────────────────────────────────────────────────────────────────┘
#
# 🔍 How They Work Together:
# --------------------------
#
#   1. Request arrives at Service "reviews"
#   2. Envoy sidecar intercepts the request
#   3. Envoy checks VirtualService rules
#   4. VirtualService says: "80% to v1, 20% to v2"
#   5. Envoy sends traffic to correct version's pods
#
#   ┌──────────────┐    ┌──────────────┐    ┌──────────────────────┐
#   │   Request    │ -> │   Service    │ -> │   Envoy (Sidecar)    │
#   │  to reviews  │    │   DNS/LB     │    │   Checks VirtualSvc  │
#   └──────────────┘    └──────────────┘    └──────────┬───────────┘
#                                                      │
#                                           ┌──────────┴───────────┐
#                                           │                      │
#                                         80%                    20%
#                                           ▼                      ▼
#                                   ┌────────────┐         ┌────────────┐
#                                   │    v1      │         │    v2      │
#                                   │   pods     │         │   pods     │
#                                   └────────────┘         └────────────┘
#
# ============================================================================

apiVersion: v1
kind: Service

metadata:
  name:
    reviews # Service name - used for DNS
    # DNS: reviews.traffic-demo.svc.cluster.local
  namespace: traffic-demo

  labels:
    app: reviews # Labels for organizing the service itself

spec:
  # ═══════════════════════════════════════════════════════════════════════
  # SELECTOR - Which pods receive traffic from this service?
  # ═══════════════════════════════════════════════════════════════════════
  #
  # IMPORTANT: We ONLY use "app: reviews" here, NOT version labels!
  #
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │                                                                     │
  # │   selector:                                                         │
  # │     app: reviews    ← Matches ALL pods with app=reviews             │
  # │                                                                     │
  # │   This means the Service can route to:                              │
  # │   ✓ reviews-v1 pods (app=reviews, version=v1)                       │
  # │   ✓ reviews-v2 pods (app=reviews, version=v2)                       │
  # │                                                                     │
  # │   Without Istio: Random distribution across all pods                │
  # │   With Istio:    Controlled by VirtualService rules                 │
  # │                                                                     │
  # └─────────────────────────────────────────────────────────────────────┘
  #
  selector:
    app: reviews
    # Note: NO version label here - intentionally matches both v1 and v2

  # ═══════════════════════════════════════════════════════════════════════
  # PORTS CONFIGURATION
  # ═══════════════════════════════════════════════════════════════════════
  #
  # Defines which ports the service exposes and where traffic goes
  #
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │                                                                     │
  # │   Client request                                                    │
  # │        │                                                            │
  # │        ▼                                                            │
  # │   ┌─────────┐                                                       │
  # │   │  port   │  (80) - Port other services use to call this service │
  # │   │         │                                                       │
  # │   └────┬────┘                                                       │
  # │        │                                                            │
  # │        ▼                                                            │
  # │   ┌────────────┐                                                    │
  # │   │ targetPort │ (80) - Port the container listens on              │
  # │   │            │                                                    │
  # │   └────────────┘                                                    │
  # │        │                                                            │
  # │        ▼                                                            │
  # │   Container                                                         │
  # │                                                                     │
  # └─────────────────────────────────────────────────────────────────────┘
  #
  ports:
    - name:
        http # Port name (required for Istio to detect protocol)
        # Istio uses this to apply HTTP-specific features
        # Common names: http, grpc, tcp, https
      port: 80 # Port exposed by the service
      targetPort: 80 # Port on the container (from Deployment)
      protocol: TCP # Network protocol

  # ═══════════════════════════════════════════════════════════════════════
  # SERVICE TYPE
  # ═══════════════════════════════════════════════════════════════════════
  #
  # ClusterIP: Only accessible within the cluster
  # - Default type
  # - No external access
  # - Other pods can reach it via: reviews.traffic-demo.svc.cluster.local
  #
  # For external access, we use the Istio Gateway instead of changing
  # the service type to NodePort or LoadBalancer
  #
  type: ClusterIP
