# ============================================================================
# KUBERNETES SERVICE FOR REVIEWS
# ============================================================================
#
# 📌 What is this file?
# ---------------------
# This Service provides a stable network endpoint for the reviews application.
# It routes traffic to ALL pods with the label "app: myapp" (both v1 & v2).
# The actual version-specific routing is handled by Istio, not Kubernetes.
#
# 🔄 Service vs VirtualService - Who Does What?
# ----------------------------------------------
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │                                                                         │
# │   Kubernetes Service                    Istio VirtualService            │
# │   ─────────────────────                 ────────────────────            │
# │                                                                         │
# │   ✓ Provides DNS name                  ✓ Traffic splitting (80/20)     │
# │     (reviews-svc.traffic-demo.svc)       between versions              │
# │                                                                         │
# │   ✓ Load balances across               ✓ Header-based routing          │
# │     all matching pods                                                   │
# │                                        ✓ Retries, timeouts             │
# │   ✓ Creates Endpoints                                                  │
# │     (list of pod IPs)                  ✓ Fault injection               │
# │                                                                         │
# │   ✗ Cannot route by version            ✓ Routes to specific versions  │
# │   ✗ No traffic splitting               ✓ Full traffic control          │
# │                                                                         │
# └─────────────────────────────────────────────────────────────────────────┘
#
# 🔍 How They Work Together:
# --------------------------
#
#   1. Request arrives at Service "reviews-svc"
#   2. Envoy sidecar intercepts the request
#   3. Envoy checks VirtualService rules
#   4. VirtualService says: "80% to v1, 20% to v2"
#   5. Envoy sends traffic to correct version's pods
#
#   ┌──────────────┐    ┌───────────────┐    ┌──────────────────────┐
#   │   Request    │ -> │   Service     │ -> │   Envoy (Sidecar)    │
#   │  to reviews  │    │ reviews-svc   │    │   Checks VirtualSvc  │
#   └──────────────┘    └───────────────┘    └──────────┬───────────┘
#                                                       │
#                                            ┌──────────┴───────────┐
#                                            │                      │
#                                          80%                    20%
#                                            ▼                      ▼
#                                    ┌────────────┐         ┌────────────┐
#                                    │    v1      │         │    v2      │
#                                    │   pods     │         │   pods     │
#                                    └────────────┘         └────────────┘
#
# ============================================================================

apiVersion: v1
kind: Service

metadata:
  # ═══════════════════════════════════════════════════════════════════════
  # SERVICE NAME - This is what DestinationRule "host" will match!
  # ═══════════════════════════════════════════════════════════════════════
  #
  # NOTE: This is "reviews-svc" (not "reviews" or "myapp")
  # DestinationRule uses: host: reviews-svc (matches THIS name)
  #
  name:
    reviews-svc # ◄──── DestinationRule "host" matches THIS
    # DNS: reviews-svc.traffic-demo.svc.cluster.local
  namespace: traffic-demo

  labels:
    service:
      reviews # Label for organizing the service itself
      # (not used for pod selection)

spec:
  # ═══════════════════════════════════════════════════════════════════════
  # SELECTOR - Which pods receive traffic from this service?
  # ═══════════════════════════════════════════════════════════════════════
  #
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │                                                                     │
  # │   SERVICE NAME vs APP LABEL - They are DIFFERENT!                   │
  # │   ───────────────────────────────────────────────                   │
  # │                                                                     │
  # │   Service name:  reviews-svc     (metadata.name)                    │
  # │   App label:     myapp           (spec.selector.app)                │
  # │                                                                     │
  # │   DestinationRule host: reviews-svc  → matches service NAME         │
  # │   Service selector: app=myapp        → matches pod LABEL            │
  # │                                                                     │
  # └─────────────────────────────────────────────────────────────────────┘
  #
  selector:
    app:
      myapp # ◄──── Matches pods with label app=myapp
      # NOT "reviews-svc"! This is a different thing!
    # Note: NO version label here - intentionally matches both v1 and v2

  # ═══════════════════════════════════════════════════════════════════════
  # PORTS CONFIGURATION
  # ═══════════════════════════════════════════════════════════════════════
  ports:
    - name: http # Port name (required for Istio to detect protocol)
      port: 80 # Port exposed by the service
      targetPort: 80 # Port on the container
      protocol: TCP

  type: ClusterIP
