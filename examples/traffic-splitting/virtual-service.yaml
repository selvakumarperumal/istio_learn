# ============================================================================
# VIRTUAL SERVICE: TRAFFIC SPLITTING RULES (80% v1 / 20% v2)
# ============================================================================
#
# 📌 What is this file?
# ---------------------
# A VirtualService defines HOW traffic is routed to a service.
# This is where the actual 80/20 traffic split is configured.
#
# 🔄 Traffic Flow:
# ----------------
#
#   ┌─────────────────────────────────────────────────────────────────────┐
#   │                                                                     │
#   │   Traffic → Gateway → VirtualService → DestinationRule → Pods      │
#   │                                                                     │
#   │   100% traffic                                                      │
#   │        │                                                            │
#   │        ▼                                                            │
#   │   ┌─────────────────┐                                               │
#   │   │ VirtualService  │                                               │
#   │   │ host: reviews-svc│                                               │
#   │   │                 │                                               │
#   │   │ route:          │                                               │
#   │   │   v1: 80%       │──────────────────────────────────┐            │
#   │   │   v2: 20%       │──────────────────────────────┐   │            │
#   │   └─────────────────┘                              │   │            │
#   │                                                    │   │            │
#   │                                                   ▼   ▼            │
#   │                                           ┌───────────────┐        │
#   │                                           │ DestinationRule│        │
#   │                                           │ subset: v1, v2│        │
#   │                                           └───────┬───────┘        │
#   │                                                   │                │
#   │                                    ┌──────────────┴──────────────┐ │
#   │                                    │                             │ │
#   │                                  80%                           20%│ │
#   │                                    ▼                             ▼ │
#   │                            ┌────────────┐                ┌────────┐│
#   │                            │ v1 pods    │                │v2 pods ││
#   │                            │ app=myapp  │                │app=myapp│
#   │                            │ version=v1 │                │version=v2│
#   │                            └────────────┘                └────────┘│
#   │                                                                     │
#   └─────────────────────────────────────────────────────────────────────┘
#
# ============================================================================

apiVersion: networking.istio.io/v1beta1
kind: VirtualService

metadata:
  name: reviews-routing
  namespace: traffic-demo

spec:
  # ═══════════════════════════════════════════════════════════════════════
  # HOSTS - What services/domains does this VirtualService apply to?
  # ═══════════════════════════════════════════════════════════════════════
  #
  # NOTE: This matches the SERVICE NAME (reviews-svc), not the app label!
  #
  hosts:
    - reviews-svc # ◄──── Service NAME (not app label "myapp"!)
    - reviews.example.com # External hostname for Gateway access

  gateways:
    - reviews-gateway
    - mesh

  http:
    - route:
        # ═══════════════════════════════════════════════════════════════
        # DESTINATION 1: Version 1 (80% of traffic)
        # ═══════════════════════════════════════════════════════════════
        - destination:
            host: reviews-svc # ◄──── Service NAME (matches metadata.name)
            subset: v1 # ◄──── Subset from DestinationRule
          weight: 80

        # ═══════════════════════════════════════════════════════════════
        # DESTINATION 2: Version 2 (20% of traffic)
        # ═══════════════════════════════════════════════════════════════
        - destination:
            host: reviews-svc # Same service, different subset
            subset: v2
          weight: 20

      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure

      timeout: 10s
